<style>
  /* Tema "Fluxo Corrente" — derivado estritamente da identidade: navy, verde-água, mostarda, off-white */
  :root{
    --navy:#1F3A5F; --navy-90:#2B4B74; --navy-20:#D2DAE5; --navy-10:#E9EDF3;
    --teal:#4A9A8F; --teal-80:#3F847A; --teal-20:#DBEBE8; --teal-10:#EDF5F3;
    --gold:#C9A84C; --gold-80:#8F7226; --gold-20:#F1E7CB; --gold-10:#F8F3E4;
    --paper:#F6F4EF; --paper-2:#EEEBE3; --paper-3:#E3DFD4;
    --ink:#1F3A5F; --ink-2:#4F6178; --muted:#7A8797;
    --ok:var(--teal); --warn:var(--gold-80);
    --fd:'Jost',system-ui,sans-serif; --fb:'IBM Plex Sans',system-ui,sans-serif;
    --r:10px; --r-sm:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.55}
  a{color:var(--teal-80)}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--paper-3);border-radius:var(--r-sm);padding:9px 12px;width:100%;transition:border-color .15s}
  input:hover,select:hover,textarea:hover{border-color:var(--navy-20)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-20)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

  /* trilho lateral */
  .rail{background:var(--navy);color:#fff;padding:26px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:12px;margin:0 8px 30px}
  .brand .mark{width:44px;height:44px;flex:none}
  .brand .name{font-family:var(--fd);font-weight:500;font-size:22px;letter-spacing:.3em;margin-right:-.3em;line-height:1;color:#fff}
  .brand .name b{color:var(--teal);font-weight:500}
  .nav{background:none;border:0;color:var(--navy-20);text-align:left;padding:10px 14px;border-radius:var(--r-sm);display:flex;justify-content:space-between;align-items:center;font-size:15px;position:relative;transition:background .15s,color .15s}
  .nav:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav.on{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
  .nav.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--gold);border-radius:2px}
  .nav .n{background:var(--teal);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;min-width:22px;text-align:center;font-family:var(--fd)}
  .nav .n:empty{display:none}
  #n-estoque{background:var(--gold);color:var(--navy)}

  /* área principal */
  main{padding:34px 40px 70px;max-width:1200px}
  .today{font-family:var(--fd);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .today a{color:var(--teal-80);text-decoration:none;border-bottom:1px solid var(--teal-20)}
  .today a:hover{border-color:var(--teal)}
  h1{font-family:var(--fd);font-weight:500;font-size:30px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--ink-2);margin:0 0 26px;max-width:66ch}
  h2{font-family:var(--fd);font-weight:500;font-size:18px;margin:28px 0 12px;color:var(--navy)}
  .panel>h2:first-child,.panel h2[style*="margin-top:0"]{margin-top:0;padding-bottom:10px;border-bottom:1px solid var(--paper-2)}

  /* faixa de fluxo */
  .flow{--fdot:16px;--ftop:20px;--fpad:8px;display:grid;grid-template-columns:repeat(5,1fr);margin:0 0 28px;position:relative;background:#fff;border:1px solid var(--paper-3);border-radius:var(--r);padding:var(--fpad);box-shadow:0 1px 2px rgba(31,58,95,.04)}
  .flow-rail,.flow-fill{position:absolute;top:calc(var(--fpad) + var(--ftop) + var(--fdot)/2 - 1.5px);height:3px;border-radius:2px;pointer-events:none}
  .flow-rail{left:10%;right:10%;background:var(--paper-2)}
  .flow-fill{background:var(--teal);transition:left .35s ease,right .35s ease}
  .stage{background:none;border:0;text-align:center;padding:var(--ftop) 8px 14px;position:relative;color:var(--ink);border-radius:var(--r-sm);transition:background .15s}
  .stage:hover{background:var(--paper)}
  .stage .dot{display:block;width:var(--fdot);height:var(--fdot);border-radius:4px;background:var(--paper-3);margin:0 auto 12px;position:relative;z-index:1;box-shadow:0 0 0 4px #fff;transition:background .2s}
  .stage.on .dot{background:var(--teal)}
  .stage.hot .dot{background:var(--gold);box-shadow:0 0 0 4px #fff,0 0 0 8px var(--gold-20)}
  .stage .k{display:block;font-family:var(--fd);font-size:36px;font-weight:500;line-height:1;color:var(--navy-20);font-variant-numeric:tabular-nums;transition:color .2s}
  .stage.on .k{color:var(--navy)}
  .stage .l{display:block;font-size:13px;color:var(--ink-2);margin-top:6px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .kpi{background:#fff;border:1px solid var(--paper-3);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 2px rgba(31,58,95,.04)}
  .kpi .k{font-family:var(--fd);font-size:28px;color:var(--navy);line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:14px;color:var(--ink-2);margin-top:4px}
  .kpis.k3{grid-template-columns:repeat(3,1fr);margin-bottom:10px}
  .panel .kpi{background:var(--paper);box-shadow:none}
  svg.chart{width:100%;height:220px}
  .soon{display:inline-block;vertical-align:middle;margin-left:8px;font-family:var(--fb);font-size:11px;font-weight:500;background:var(--gold-20);color:var(--gold-80);border-radius:4px;padding:2px 8px}
  .inline-form{margin-top:10px;background:var(--paper);border:1px solid var(--paper-3);border-radius:var(--r-sm);padding:12px}
  canvas#sig{width:100%;height:120px;background:#fff;border:1px dashed var(--navy-20);border-radius:var(--r-sm);touch-action:none;cursor:crosshair}
  .track{max-width:560px;background:#fff;border:1px solid var(--paper-3);border-radius:var(--r);padding:22px 24px;box-shadow:0 1px 2px rgba(31,58,95,.04)}
  .track-head{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-bottom:16px;border-bottom:1px solid var(--paper-2)}
  .track .big{font-family:var(--fd);font-size:24px;color:var(--navy);line-height:1.1}
  .steps{list-style:none;margin:18px 0 0;padding:0}
  .steps li{position:relative;padding:0 0 18px 30px;color:var(--muted)}
  .steps li::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--paper-3)}
  .steps li:last-child::before{display:none}
  .steps li span{position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--paper-3)}
  .steps li.ok{color:var(--ink)} .steps li.ok span{background:var(--teal);border-color:var(--teal)}
  .steps li.now{color:var(--navy);font-weight:500} .steps li.now span{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-20)}
  .steps li.fail{color:var(--gold-80)} .steps li.fail span{background:var(--gold-80);border-color:var(--gold-80)}
  .phone{max-width:230px;margin:12px auto 0;background:var(--navy);border-radius:22px;padding:12px 10px;color:#fff}
  .phone-bar{height:4px;width:60px;background:rgba(255,255,255,.3);border-radius:2px;margin:0 auto 10px}
  .phone-map{height:150px;border-radius:12px;background:var(--teal-10);position:relative;background-image:linear-gradient(var(--teal-20) 1px,transparent 1px),linear-gradient(90deg,var(--teal-20) 1px,transparent 1px);background-size:22px 22px}
  .phone-map .pin{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--navy);left:40%;top:30%}
  .phone-map .pin.p2{left:70%;top:60%}
  .phone-map .me{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gold);left:22%;top:68%;box-shadow:0 0 0 6px var(--gold-20)}
  .phone-foot{font-size:12px;margin-top:10px;text-align:center;color:#D2DAE5}
  code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--paper-2);padding:1px 6px;border-radius:4px}
  /* blocos */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  .panel{background:#fff;border:1px solid var(--paper-3);border-radius:var(--r);padding:20px 22px;box-shadow:0 1px 2px rgba(31,58,95,.04)}

  async del(k){ if(window.storage) return window.storage.delete(k,false); localStorage.removeItem(k) },
};

async function save(){

  catch(e){ if(!avisouSave){avisouSave=true; toast('Não foi possível salvar. Exporte os dados em Gestão antes de fechar.')} }

// zerar: começa o uso real do zero, sem ler o que estiver salvo
async function carregar(zerar){
  travado=false;
  S=MODO==='real'?estadoVazio():estadoDemo(); nextId=MODO==='real'?1:106; Object.assign(BASE,BASE0);
  HOJE=MODO==='real'?iso(new Date(),10):HOJE_DEMO;
  fixarPrecos();
  if(zerar) return;
  try{
    const v=await DB.get(chaveEstado());
    if(!v){ if(MODO==='real'){travado=true; toast('Os dados de uso real não foram encontrados. Nada será gravado; recarregue a página.')} return }
    const d=JSON.parse(v);
    S={...S,...d.S};                       // merge: estado antigo não derruba campos novos
    if(d.nextId) nextId=d.nextId;
    if(d.BASE) Object.assign(BASE,d.BASE);
    S.view='painel'; S.acao=null; S.editProd=null;
    fixarPrecos(); fecharRotaSeConcluida();
  }catch(e){
    if(MODO==='real'){travado=true; toast('Os dados de uso real não puderam ser lidos. Nada será gravado; recarregue a página.')}
    else toast('Os dados salvos não puderam ser lidos. Voltando aos dados de exemplo.');
  }
}
async function trocarModo(m){

  if(m==='real'){ try{existe=!!(await DB.get('fluxo-real'))}catch(e){return toast('Não foi possível acessar os dados salvos. Tente de novo.')} }
  MODO=m;

function flowStrip(){
  const counts = Object.fromEntries(STAGES.map(([k])=>[k,S.pedidos.filter(p=>p.status===k).length]));
  const ocupadas = STAGES.map(([k],i)=>counts[k]?i:-1).filter(i=>i>=0);
  const de = ocupadas.length?Math.min(...ocupadas):0, ate = ocupadas.length?Math.max(...ocupadas):-1;
  const centro = i=>(i+.5)/STAGES.length*100;
  const trilho = ate>de?`<span class="flow-fill" style="left:${centro(de)}%;right:${100-centro(ate)}%"></span>`:'';
  return `<nav class="flow" aria-label="Etapas do fluxo">
    <span class="flow-rail"></span>${trilho}
    ${STAGES.map(([k,l])=>`<button class="stage${counts[k]?' on':''}${k==='entrega'&&counts[k]?' hot':''}" onclick="go('${STAGE_VIEW[k]}')" aria-label="${counts[k]} em ${l}"><span class="dot"></span><span class="k">${counts[k]}</span><span class="l">${l}</span></button>`).join('')}

}

// Lê latitude e longitude de links longos do Google Maps (…!3dLAT!4dLNG, …/@LAT,LNG, ?q=, ?query=, ll=, destination=)
// e de coordenadas coladas ("-20.0247, -48.9406"). O pino (!3d!4d) vale mais que o centro da tela (@).
// Link curto (maps.app.goo.gl) não traz a coordenada e o navegador não consegue abri-lo daqui (CORS).
function coordDoMapa(txt){
  let s=String(txt||'').trim(); if(!s) return null;
  try{s=decodeURIComponent(s.replace(/\+/g,' '))}catch(e){}
  const m=s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)||s.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  if(!m) return /goo\.gl|maps\.app/i.test(s)?{curto:true}:{erro:true};
  const lat=+m[1], lng=+m[2];
  return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:{erro:true};
}
function lerMapa(){
  const c=coordDoMapa(document.getElementById('f-mapa').value), st=document.getElementById('f-mapa-st'); if(!st) return;
  const km=c&&'lat' in c?dist(BASE,c):0;
  st.className=c&&!('lat' in c)||km>50?'muted low':'muted';
  st.textContent=!c?'Sem link, a posição fica aproximada, perto da base.'
    :c.curto?'Link curto não traz a coordenada. Abra o link no navegador e copie o endereço completo, ou toque e segure no local no Google Maps e copie os números.'
    :c.erro?'Não encontrei latitude e longitude neste link.'
    :`Posição lida: ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)} · ${km.toFixed(1).replace('.',',')} km da base${km>50?'. Confira, está longe da base.':''}`;
}

/* Leitor de mensagens sem IA: procura no texto o catálogo, as quantidades, o endereço e o telefone.
   Cobre o pedido típico ("sou a Ana da Lanchonete Central, quero 5 queijos e 2 potes de mel, entrega na Rua Amazonas 45"). */
const semAcento=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const NUM_EXTENSO={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,quinze:15,vinte:20,trinta:30};
function lerMensagem(msg){
  const t=semAcento(msg);
  // cliente: "sou a Ana da Lanchonete Central", "aqui é da Padaria X", "meu nome é Ana"
  const mc=msg.match(/(?:\bsou (?:a |o )?|aqui (?:é|e) (?:a |o |da |do )?|meu nome (?:é|e) )([^,.;!?\n]+?)(?=\s*(?:[,.;!?\n]|\b(?:quero|queria|gostaria|preciso|vou querer|pode|manda)\b|$))/i);
  // telefone: (34) 99911-0001, 34999110001, +55 34 9 9911 0001
  const mt=msg.match(/(?:\+?55[\s-]?)?\(?\b\d{2}\)?[\s-]?9?[\s.-]?\d{4}[\s.-]?\d{4}\b/);
  let tel=mt?mt[0].replace(/\D/g,''):''; if(tel.length===10||tel.length===11) tel='55'+tel;
  // endereço: começa num tipo de logradouro e vai até a vírgula, ponto ou fim (o número vem junto)
  const me=msg.match(/\b((?:rua|r\.|avenida|av\.?|travessa|tv\.|alameda|pra[çc]a|rodovia|estrada|s[íi]tio|fazenda|ch[áa]cara)\s+[^,.;!?\n]+?(?:,\s*(?:n[º°o.]?\s*)?\d+[a-z]?)?)(?=\s*(?:[.;!?\n]|,(?!\s*(?:n[º°o.]?\s*)?\d)|\b(?:pra|para|amanh|hoje|bairro)\b|$))/i);
  // itens: "5 queijos", "2 potes de mel", "uma dúzia de ovos" (número até 3 palavras antes do produto)
  const itens=[];
  for(const p of S.produtos){
    const chave=semAcento(p.nome).split(/\s+/)[0].replace(/[^a-z]/g,'');
    if(chave.length<3) continue;
    const raiz=chave.replace(/s$/,'');
    // as palavras do meio não podem ser outro número nem "e": em "10 rapaduras e um mel" o mel é 1, não 10
    const nums=Object.keys(NUM_EXTENSO).join('|');
    const re=new RegExp(`\\b(\\d+|${nums})\\s+(?:(?!(?:e|${nums})\\b)[a-z]+\\s+){0,3}?${raiz}(?:s|es)?\\b`);
    const m=t.match(re);
    if(m) itens.push({p:p.id,q:+m[1]||NUM_EXTENSO[m[1]]||1});
    else if(new RegExp(`\\b${raiz}(?:s|es)?\\b`).test(t)) itens.push({p:p.id,q:1});
  }
  let cliente=mc?mc[1].trim():'';
  if(cliente&&cliente===cliente.toLowerCase()) cliente=cliente.replace(/(^|\s)(\p{L})/gu,(_,a,b)=>a+b.toUpperCase()).replace(/ (Da|De|Do|Das|Dos|E) /g,s=>s.toLowerCase());
  // o bairro no fim do endereço vai para o campo Bairro (extrasMensagem), não fica repetido no endereço
  let endereco=me?me[1].trim():'';
  for(const b of S.bairros){const r=new RegExp(`[\\s,-]+${semAcento(b.n)}$`,'i'); if(r.test(semAcento(endereco))) endereco=endereco.slice(0,endereco.length-semAcento(endereco).match(r)[0].length)}
  return {cliente,telefone:tel,endereco,itens};
}
// data, janela e bairro: lidos sempre pelas regras, também quando a IA preenche o resto
function extrasMensagem(msg){
  const t=semAcento(msg), d=new Date(HOJE+'T12:00');
  let prev='';
  if(/\bdepois de amanha\b/.test(t)){d.setDate(d.getDate()+2);prev=iso(d,10)}
  else if(/\bamanha\b/.test(t)){d.setDate(d.getDate()+1);prev=iso(d,10)}
  else if(/\bhoje\b/.test(t)) prev=HOJE;
  const janela=/\b(?:a|de|pela|na)\s+tarde\b|\btardinha\b/.test(t)?'Tarde':/\b(?:de|pela|na|cedo)\s+manha\b|\bcedinho\b/.test(t)?'Manhã':'';
  const bairro=S.bairros.find(b=>t.includes(semAcento(b.n)))?.n||'';
  return {prev,janela,bairro};
}

/* ---------- rotas ---------- */
const dist=(a,b)=>Math.hypot((a.lat-b.lat)*111,(a.lng-b.lng)*111*Math.cos(a.lat*Math.PI/180));
function otimizar(ids){ // vizinho mais próximo a partir da base
  let cur=BASE, rest=ids.map(id=>byId(S.pedidos,id)), out=[];
  while(rest.length){rest.sort((a,b)=>dist(cur,a)-dist(cur,b));const n=rest.shift();out.push(n.id);cur=n;}
  return out;
}
function rotas(){
  const prontos=S.pedidos.filter(p=>p.status==='separado');
  const r=S.rota;
  return `<h1>Rotas</h1><p class="sub">Monte a rota do dia com os pedidos separados. A ordem é calculada a partir da base e aberta direto no Google Maps.</p>
  <div class="cols">
    <div class="panel">

        <div class="actions">
          ${mapsTrechos(r.paradas).map((t,i,a)=>`<a class="btn teal" target="_blank" href="${mapsUrl(t.pts,t.origem)}">${a.length>1?`Google Maps · paradas ${t.de}–${t.ate}`:'Abrir no Google Maps'}</a>`).join('')}
          ${r.paradas.some(id=>byId(S.pedidos,id).status==='rota')?`<button class="btn" onclick="iniciarEntregas()">Motorista saiu</button>`:''}
          <button class="btn ghost" onclick="desfazerRota()">Desfazer rota</button>
        </div>`
      :`<h2 style="margin-top:0">${prontos.length} pedidos prontos</h2>
        ${prontos.length?`<table>${prontos.map(p=>`<tr><td><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="sel" value="${p.id}" checked style="width:auto"> ${esc(p.cliente)}</label></td><td class="muted">${esc(p.end)}</td></tr>`).join('')}</table>
        <div class="row" style="margin-top:14px"><div class="field"><label>Motorista</label><select id="mot">${S.motoristas.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div></div>
        <div class="actions"><button class="btn" onclick="criarRota()">Calcular rota</button></div>`
        :'<p class="empty">Separe pedidos para montar uma rota.</p>'}`}
    </div>
    <div class="panel"><h2 style="margin-top:0">Mapa das paradas</h2><svg class="map" id="map" viewBox="0 0 600 340"></svg>
      <p class="muted">Esquema em escala real das distâncias (km). A rota detalhada fica no Google Maps.</p></div>
  </div>`;
}
function criarRota(){
  const ids=[...document.querySelectorAll('.sel:checked')].map(c=>+c.value); if(!ids.length)return toast('Selecione ao menos um pedido');
  if(!document.getElementById('mot').value)return toast('Cadastre um motorista em Gestão');
  const paradas=otimizar(ids); paradas.forEach(id=>mudarStatus(byId(S.pedidos,id),'rota'));
  S.rota={motorista:document.getElementById('mot').value,paradas,criada:agora()};
  const km=[BASE,...paradas.map(id=>byId(S.pedidos,id))].reduce((s,p,i,a)=>i?s+dist(a[i-1],p):0,0);
  toast(`Rota com ${paradas.length} paradas, ~${km.toFixed(1)} km`); render();
}
function iniciarEntregas(){S.rota.paradas.forEach(id=>{const p=byId(S.pedidos,id);if(p.status==='rota'){mudarStatus(p,'entrega');notificar(p,'Saiu para entrega')}});toast('Entregas iniciadas');go('entregas')}
function desfazerRota(){S.rota.paradas.forEach(id=>{const p=byId(S.pedidos,id);if(['rota','entrega'].includes(p.status))mudarStatus(p,'separado')});S.rota=null;render()}
// sem parada pendente (todas entregues ou com falha), a rota acaba e libera a montagem da próxima
function fecharRotaSeConcluida(){
  if(S.rota&&!S.rota.paradas.some(id=>['rota','entrega'].includes(byId(S.pedidos,id)?.status))){S.rota=null;return true}
  return false;
}
// o Google Maps aceita até 9 paradas intermediárias por link: rotas maiores viram trechos de 10 paradas,
// cada um saindo da última parada do anterior
function mapsTrechos(ids){
  const out=[];
  for(let i=0;i<ids.length;i+=10){
    const anterior=i?byId(S.pedidos,ids[i-1]):BASE;
    out.push({origem:anterior,pts:ids.slice(i,i+10),de:i+1,ate:Math.min(i+10,ids.length)});
  }
  return out;
}
function mapsUrl(ids,origem=BASE){const pts=ids.map(id=>{const p=byId(S.pedidos,id);return `${p.lat},${p.lng}`});return `https://www.google.com/maps/dir/?api=1&origin=${origem.lat},${origem.lng}&destination=${pts[pts.length-1]}&waypoints=${pts.slice(0,-1).join('|')}&travelmode=driving`}
// nome do cliente ao lado do ponto: até 22 letras cortando na palavra, e do lado esquerdo quando o ponto está perto da borda direita
function rotulo(x,y,nome){
  let n=nome; if(n.length>22){n=n.slice(0,22).replace(/\s+\S*$/,'')+'…'}
  const esq=x>400;
  return `<text x="${esq?x-15:x+15}" y="${y+4}" font-size="12" fill="#1F3A5F" text-anchor="${esq?'end':'start'}">${esc(n)}</text>`;
}
function drawMap(){
  const svg=document.getElementById('map'); if(!svg)return;
  const ids=S.rota?S.rota.paradas:S.pedidos.filter(p=>p.status==='separado').map(p=>p.id);
  const pts=[BASE,...ids.map(id=>byId(S.pedidos,id))];
  const xs=pts.map(p=>p.lng),ys=pts.map(p=>p.lat);
  const mnx=Math.min(...xs)-.004,mxx=Math.max(...xs)+.004,mny=Math.min(...ys)-.003,mxy=Math.max(...ys)+.003;
  const X=v=>40+(v-mnx)/(mxx-mnx||1)*520, Y=v=>300-(v-mny)/(mxy-mny||1)*260;
  let h=`<defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#DBEBE8" stroke-width="1"/></pattern></defs><rect width="600" height="340" fill="url(#g)"/>`;
  if(S.rota) h+=`<polyline points="${pts.map(p=>`${X(p.lng)},${Y(p.lat)}`).join(' ')}" fill="none" stroke="#4A9A8F" stroke-width="3" stroke-dasharray="6 5"/>`;
  pts.forEach((p,i)=>{const x=X(p.lng),y=Y(p.lat);
    h+= i===0?`<rect x="${x-8}" y="${y-8}" width="16" height="16" fill="#C9A84C"/><text x="${x+12}" y="${y+4}" font-size="12" fill="#1F3A5F">Base</text>`
      :`<circle cx="${x}" cy="${y}" r="11" fill="${p.status==='entregue'?'#4A9A8F':p.status==='falha'?'#8F7226':'#1F3A5F'}"/><text x="${x}" y="${y+4}" font-size="11" fill="#fff" text-anchor="middle">${S.rota?i:''}</text>${rotulo(x,y,p.cliente)}`});
  svg.innerHTML=h;
}

let sigDirty=false;
function initSig(){const c=document.getElementById('sig');if(!c)return;c.width=Math.round(c.clientWidth)||420;/* bitmap na largura real: traço sem distorção no celular */const ctx=c.getContext('2d');ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#1F3A5F';let d=false;const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]};
  const down=e=>{d=true;ctx.beginPath();ctx.moveTo(...pos(e));e.preventDefault()},move=e=>{if(!d)return;ctx.lineTo(...pos(e));ctx.stroke();sigDirty=true;e.preventDefault()},up=()=>d=false;
  c.onmousedown=down;c.onmousemove=move;c.onmouseup=c.onmouseleave=up;c.ontouchstart=down;c.ontouchmove=move;c.ontouchend=up;sigDirty=false}
function limparSig(){const c=document.getElementById('sig');c.getContext('2d').clearRect(0,0,c.width,c.height);sigDirty=false}
// A foto vai para o estado e para o storage. Uma foto de celular crua (4 MB em base64) estoura a cota
// depois de duas ou três entregas. 720 px / JPEG 0.6 basta para ler um canhoto assinado.
function reduzirFoto(file){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const e=720/Math.max(img.width,img.height,720), c=document.createElement('canvas');
      c.width=Math.round(img.width*e); c.height=Math.round(img.height*e);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.6));
    };
    img.onerror=()=>{URL.revokeObjectURL(url); res(null)};
    img.src=url;
  });
}
async function confirmarEntrega(id){

  const foto=f?await reduzirFoto(f):null, ts=agora();
  p.comprovante={recebedor:nome,hora:ts,foto:!!foto,assinatura:!!assin};
  if(foto) p.comprovante.fotoData=foto;
  if(assin) p.comprovante.assinaturaData=assin;
  mudarStatus(p,'entregue',ts); p.motorista=S.rota?.motorista; notificar(p,'Entregue'); S.acao=null;
  toast(fecharRotaSeConcluida()?`Pedido ${id} entregue. Rota concluída`:`Pedido ${id} entregue`); render();
}
function registrarOcorrencia(id){
  const p=byId(S.pedidos,id), m=document.getElementById('oc-m').value, d=document.getElementById('oc-d').value, o=document.getElementById('oc-o').value.trim();
  const ts=agora();
  p.ocorrencia={motivo:m,obs:o,hora:ts,reagendado:d||null}; p.motorista=S.rota?.motorista;
  if(d){
    mudarStatus(p,'separado',ts); p.prev=d;
    // sai da rota de hoje, senão continua listado como parada e ainda entra na próxima rota
    if(S.rota){S.rota.paradas=S.rota.paradas.filter(x=>x!==id); if(!S.rota.paradas.length) S.rota=null}
    notificar(p,`Reagendado para ${d.slice(8)}/${d.slice(5,7)}`); toast(`Pedido ${id} reagendado`)
  }
  else{mudarStatus(p,'falha',ts);p.itens.forEach(i=>{byId(S.produtos,i.p).qtd+=i.q;mov(i.p,'entrada',i.q,`Devolução #${id}`)});notificar(p,'Entrega não realizada');toast(`Pedido ${id} devolvido ao estoque`)}
  fecharRotaSeConcluida(); S.acao=null; render();
}

/* ---------- pix ---------- */
function crc16(s){let c=0xFFFF;for(const ch of s){c^=ch.charCodeAt(0)<<8;for(let i=0;i<8;i++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function brcode(p){
  const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase();
  const mai=tlv('00','br.gov.bcb.pix')+tlv('01',S.chave.valor)+tlv('02',`Pedido ${p.id}`.slice(0,40));
  let s=tlv('00','01')+tlv('01','12')/* uso único: o valor é do pedido */+tlv('26',mai)+tlv('52','0000')+tlv('53','986')+tlv('54',total(p).toFixed(2))+tlv('58','BR')+tlv('59',norm(S.chave.nome).slice(0,25))+tlv('60',norm(S.chave.cidade).slice(0,15))+tlv('62',tlv('05',`FLX${p.id}`))+'6304';
  return s+crc16(s);
}
// o pedido cobrado sai sempre da lista de abertos: QR, código e seletor mostram o mesmo pedido

    </div>

function drawQr(){const el=document.getElementById('qr');const sel=pixAtual();if(!el||!sel)return;el.innerHTML='';try{new QRCode(el,{text:brcode(sel),width:200,height:200,colorDark:'#1F3A5F',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent='QR indisponível (biblioteca não carregou). Use o código copia e cola.'}}
function copiarPix(id){
  const p=byId(S.pedidos,id); if(!p) return;
  const falha=()=>toast('Copie o código que está abaixo do QR');
  if(!navigator.clipboard) return falha();
  navigator.clipboard.writeText(brcode(p)).then(()=>toast('Código Pix copiado'),falha);
}

/* ---------- assistente ---------- */
/* O navegador não pode chamar api.anthropic.com direto: não há chave (e não deve haver, num HTML público)
   e o CORS bloqueia a requisição. Usamos o runtime do Claude quando ele existe; sem ele o assistente responde
   às perguntas mais comuns por respostaLocal() e o pedido é lido por lerMensagem().
   Sem backend próprio. Para hospedar fora, trocar por fetch('/api/claude') com a chave no servidor. */
const temIA = ()=>typeof window.claude?.complete==='function';
// não pode se chamar "claude": uma função global com esse nome substitui o window.claude do runtime
async function chamarIA(prompt){
  if(!temIA()) throw new Error('assistente indisponível');
  const r=await window.claude.complete(prompt);
  return typeof r==='string'?r:String(r??'');
}
function assistente(){
  const sug=['Quantos pedidos faltam sair hoje?','Quais produtos preciso repor?','Quanto tenho a receber e de quem?','Qual foi a entrega mais longe da base?'];
  const on=temIA();
  return `<h1>Assistente</h1><p class="sub">Pergunte sobre a operação em linguagem natural. Ele lê os dados desta tela e responde em segundos.</p>
  <div class="panel chat">
    <div class="msgs" id="msgs">${S.chat.length?S.chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join(''):'<p class="empty">Nenhuma pergunta ainda. Comece por uma das sugestões.</p>'}</div>
    <div class="chips">${sug.map(s=>`<button class="chip" onclick="perguntar(${esc(JSON.stringify(s))})">${esc(s)}</button>`).join('')}</div>
    <div class="compose"><input id="q" placeholder="Escreva sua pergunta" onkeydown="if(event.key==='Enter')perguntar(this.value)"><button class="btn" onclick="perguntar(document.getElementById('q').value)">Enviar</button></div>
    ${on?'':'<div class="note">Sem a IA conectada, o assistente responde pelas regras do Fluxo: pedidos que faltam sair, reposição, valores a receber, atrasos, vendas e distância das entregas.</div>'}
  </div>
`;
}
async function perguntar(q){
  q=q.trim(); if(!q)return;
  S.chat.push({role:'user',content:q}); render();
  // foto e assinatura (base64, dezenas de KB cada) ficam fora: só o que o assistente precisa para responder
  const semImagem=({comprovante:c,...p})=>({...p,total:total(p),...(c&&{comprovante:{recebedor:c.recebedor,hora:c.hora,foto:c.foto,assinatura:c.assinatura}})});
  const ctx={data:HOJE,base:BASE,produtos:S.produtos,pedidos:S.pedidos.map(semImagem),rota:S.rota};
  const sys=`Você é o assistente do Fluxo, sistema de logística de uma cooperativa em Frutal-MG. Responda em português, curto e direto, sem markdown, com números concretos. Dados atuais: ${JSON.stringify(ctx)}`;
  const hist=S.chat.slice(-8).map(m=>`${m.role==='user'?'Pergunta':'Resposta'}: ${m.content}`).join('\n');
  let a=null;
  if(temIA()){ try{a=await chamarIA(`${sys}\n\n${hist}\n\nResposta:`)}catch(e){} }
  S.chat.push({role:'assistant',content:a||respostaLocal(q)}); // sem IA (ou se ela falhar), responde pelas regras
  const inp=document.getElementById('q'); if(inp) inp.value='';
  render();
}
// Respostas sem IA: reconhece o assunto da pergunta por palavras-chave e calcula com os mesmos dados do Painel e da Gestão
function respostaLocal(q){
  const t=semAcento(q), km=v=>v.toFixed(1).replace('.',','), dm=ts=>`${ts.slice(8,10)}/${ts.slice(5,7)}`;
  const lista=xs=>xs.length<=1?xs.join(''):xs.slice(0,-1).join(', ')+' e '+xs.at(-1);
  if(/longe|distan|perto|\bkm\b/.test(t)){
    const ent=S.pedidos.filter(p=>p.status==='entregue').map(p=>({p,d:dist(BASE,p)})).sort((a,b)=>b.d-a.d);
    if(!ent.length) return 'Ainda não há entregas concluídas.';
    const {p,d}=ent[0];
    return `A entrega mais longe foi para ${p.cliente} (${p.end}), a ${km(d)} km da base, em ${dm(dataEntrega(p))}. A média das ${ent.length} entregas é ${km(ent.reduce((s,x)=>s+x.d,0)/ent.length)} km.`;
  }
  if(/atras|prazo|pontual/.test(t)){
    const vencidos=S.pedidos.filter(p=>['novo','separado','rota','entrega'].includes(p.status)&&p.prev&&p.prev<HOJE);
    const comPrazo=S.pedidos.filter(p=>noPrazo(p)!==null), late=comPrazo.filter(p=>noPrazo(p)===false);
    return `${vencidos.length?`${vencidos.length} ${vencidos.length===1?'pedido está':'pedidos estão'} com a data prevista vencida: ${lista(vencidos.map(p=>`${p.cliente} (#${p.id}, previsto ${dm(p.prev)})`))}.`:'Nenhum pedido em aberto está com a data prevista vencida.'} Das ${comPrazo.length} entregas concluídas com data prevista, ${late.length} ${late.length===1?'chegou':'chegaram'} depois do prazo${late.length?`: ${lista(late.map(p=>p.cliente))}`:''}.`;
  }
  if(/repor|reposi|estoque|acaband|minimo/.test(t)){
    if(!S.produtos.length) return 'Nenhum produto cadastrado ainda.';
    const b=S.produtos.filter(p=>p.qtd<=p.min);
    return b.length?`Precisa repor ${b.length===1?'1 produto':`${b.length} produtos`}: ${lista(b.map(p=>`${p.nome} (${p.qtd} un, mínimo ${p.min})`))}.`:'Nenhum produto está no mínimo.';
  }
  if(/receber|devend|\bdeve|pagar|pagou|pagamento|\bpix\b|cobr/.test(t)){
    const ab=pixAbertos(); if(!ab.length) return 'Nada a receber: todos os pedidos estão pagos.';
    const por={}; ab.forEach(p=>por[p.cliente]=(por[p.cliente]||0)+total(p));
    return `${brl(ab.reduce((s,p)=>s+total(p),0))} a receber de ${ab.length} ${ab.length===1?'pedido':'pedidos'}: ${lista(Object.entries(por).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`${c} (${brl(v)})`))}.`;
  }
  if(/vend|fatur|receita|ganh/.test(t)){
    const ent=S.pedidos.filter(p=>p.status==='entregue'); if(!ent.length) return 'Ainda não há vendas entregues.';
    const soma=ent.reduce((s,p)=>s+total(p),0), v={}; ent.forEach(p=>p.itens.forEach(i=>v[i.p]=(v[i.p]||0)+i.q*precoItem(i)));
    const [id,val]=Object.entries(v).sort((a,b)=>b[1]-a[1])[0];
    return `Foram ${ent.length} entregas, somando ${brl(soma)} (ticket médio de ${brl(soma/ent.length)}). O produto que mais vendeu foi ${byId(S.produtos,+id)?.nome||'—'}, com ${brl(val)}.`;
  }
  if(/sair|falt|pendent|aberto|pedido|hoje|rota|entreg/.test(t)){
    const nome={novo:'para separar',separado:'separados, esperando rota',rota:'na rota, esperando o motorista sair',entrega:'já saíram e estão em entrega'};
    const grupos=['novo','separado','rota','entrega'].map(s=>[s,S.pedidos.filter(p=>p.status===s&&(!p.prev||p.prev<=HOJE))]).filter(([,ps])=>ps.length);
    if(!grupos.length) return 'Nenhum pedido pendente para hoje.';
    const falta=grupos.filter(([s])=>s!=='entrega').reduce((n,[,ps])=>n+ps.length,0);
    return `${falta?`${falta} ${falta===1?'pedido falta':'pedidos faltam'} sair hoje.`:'Todos os pedidos de hoje já saíram.'} ${grupos.map(([s,ps])=>`${ps.length} ${nome[s]}: ${lista(ps.map(p=>p.cliente))}.`).join(' ')}`;
  }
  return 'Sem a IA conectada, respondo sobre pedidos que faltam sair, reposição de estoque, valores a receber, atrasos, vendas e distância das entregas. Tente uma das sugestões abaixo.';
}

/* ---------- gestão ---------- */
const minEntre=(a,b)=>(new Date(b)-new Date(a))/6e4;
const fmtDur=m=>m<60?`${Math.round(m)} min`:m<1440?`${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,'0')} min`:`${Math.floor(m/1440)} d ${Math.round(m%1440/60)} h`;
// Indicadores da hipótese. Pedidos e movimentos sem horário (criados antes do registro) ficam de fora.
function validacao(){
  // 1. do pedido (criado) à primeira saída para entrega; reentregas depois de reagendamento não contam de novo
  const saidas=S.pedidos.map(p=>{const s=quando(p,'entrega');return s?minEntre(quando(p,'novo')||p.criado,s):null}).filter(m=>m!=null&&m>=0);
  // 2. contagens dos últimos 7 dias (hoje incluso) em que o contado diferiu do sistema
  const ini=new Date(HOJE+'T12:00'); ini.setDate(ini.getDate()-6); const desde=iso(ini,10);
  const cont=(S.movimentos||[]).filter(m=>m.tipo==='ajuste'&&m.dif!=null&&m.ts.slice(0,10)>=desde), div=cont.filter(m=>m.dif);
  // 3. pagos em até 24h após a entrega; quem ainda está dentro das 24h sem pagar só entra quando o prazo fecha
  const agoraMs=new Date(agora()).getTime(); // relógio da demonstração quando em demo
  const elig=S.pedidos.map(p=>({p,e:quandoUlt(p,'entregue')||p.comprovante?.hora})).filter(({p,e})=>p.status==='entregue'&&e&&(p.pagoEm||!p.pago)&&(p.pagoEm||agoraMs-new Date(e)>=864e5));
  const em24=elig.filter(({p,e})=>p.pagoEm&&minEntre(e,p.pagoEm)<=1440).length;
  return {saidaMedia:saidas.length?saidas.reduce((s,m)=>s+m,0)/saidas.length:null,nSaidas:saidas.length,
    desde,nCont:cont.length,nDiv:div.length,unDiv:div.reduce((s,m)=>s+Math.abs(m.dif),0),
    nElig:elig.length,em24,pct24:elig.length?em24/elig.length*100:null};
}

  const top=Object.entries(vendidos).map(([id,x])=>({p:byId(S.produtos,+id),...x})).filter(x=>x.p).sort((a,b)=>b.v-a.v).slice(0,5);
  const cli={}; S.pedidos.forEach(p=>{const c=cli[p.cliente]||(cli[p.cliente]={n:0,v:0,tel:p.tel,ult:''});c.n++;if(p.status==='entregue')c.v+=total(p);if(p.criado>c.ult)c.ult=p.criado});
  const clientes=Object.entries(cli).sort((a,b)=>b[1].v-a[1].v);
  const porMot=S.motoristas.map(m=>({m,ent:ent.filter(p=>p.motorista===m).length,fal:fal.filter(p=>p.motorista===m).length}));
  const comPrazo=ent.filter(p=>noPrazo(p)!==null), pontual=comPrazo.filter(p=>noPrazo(p)).length;
  const custo=ent.reduce((s,p)=>s+(S.custoParada[p.motorista]||0),0), fretes=ent.reduce((s,p)=>s+(p.frete||0),0);
  const kpi=(k,l,sub='')=>`<div class="kpi"><div class="k">${k}</div><div class="l">${l}</div>${sub?`<div class="muted">${sub}</div>`:''}</div>`;
  const v=validacao();
  return `<h1>Gestão</h1><p class="sub">Visão do responsável: resultado, produtos que mais vendem, clientes recorrentes e equipe.</p>
  <div class="panel" style="margin-bottom:22px"><h2 style="margin-top:0">Validação da hipótese</h2>
    <p class="muted" style="margin:0 0 14px">Organizar pedido, estoque, rota e cobrança num só lugar deve reduzir o tempo até a saída, as divergências de estoque e o atraso no pagamento.</p>
    <div class="kpis k3">
      ${kpi(v.saidaMedia==null?'—':fmtDur(v.saidaMedia),'Tempo médio do pedido até a saída',v.nSaidas?`média de ${v.nSaidas} ${v.nSaidas===1?'pedido':'pedidos'} que saíram para entrega`:'nenhum pedido saiu para entrega ainda')}
      ${kpi(`${v.nDiv} · ${v.unDiv} un`,'Divergências de estoque na semana',`${v.nDiv} de ${v.nCont} ${v.nCont===1?'contagem':'contagens'} com diferença desde ${v.desde.slice(8)}/${v.desde.slice(5,7)}`)}
      ${kpi(v.pct24==null?'—':Math.round(v.pct24)+'%','Pedidos pagos em até 24h após a entrega',v.nElig?`${v.em24} de ${v.nElig} entregas`:'nenhuma entrega com prazo de 24h encerrado')}
    </div>
    <div class="note" style="margin-top:4px">${MODO_NOTA()}Entregas das últimas 24h ainda sem pagamento só entram na conta quando o prazo termina. Pedidos registrados antes do registro de horários ficam de fora.</div>
  </div>
  <div class="kpis">
    ${kpi(brl(receita8),'Receita entregue',`últimos 8 dias · desde ${dias[0].slice(8)}/${dias[0].slice(5,7)}`)}
    ${kpi(brl(areceber),'A receber','pedidos sem Pix confirmado')}
    ${kpi(brl(ticket),'Ticket médio','por entrega')}
    ${kpi(fin?Math.round(ent.length/fin*100)+'%':'—','Entregas concluídas',`${ent.length} de ${fin} finalizadas`)}
  </div>
  <div class="kpis">
    ${kpi(comPrazo.length?Math.round(pontual/comPrazo.length*100)+'%':'—','Entregas no prazo',`${pontual} de ${comPrazo.length} com data prevista`)}
    ${kpi(brl(custo),'Custo de entrega','pago aos motoristas por parada')}
    ${kpi(brl(fretes),'Frete cobrado','taxas por bairro')}
    ${kpi(brl(fretes-custo),'Margem do frete',fretes-custo<0?'frete não cobre o custo':'frete cobre o custo')}
  </div>
  <div class="cols">
    <div class="panel"><h2 style="margin-top:0">Receita por dia</h2><svg class="chart" id="chart" viewBox="0 0 560 220"></svg></div>
    <div class="panel"><h2 style="margin-top:0">Produtos mais vendidos</h2>
      ${top.length?`<table>${top.map(x=>`<tr><td>${esc(x.p.nome)}</td><td class="nw muted">${x.q} un</td><td class="num">${brl(x.v)}</td></tr>`).join('')}</table>`:'<p class="empty">Sem vendas concluídas.</p>'}</div>
  </div>
  <div class="cols" style="margin-top:22px">
    <div class="panel"><h2 style="margin-top:0">Clientes</h2>
      <table class="tg t-cli"><tr><th>Cliente</th><th class="nw">Pedidos</th><th class="nw" style="text-align:right">Comprado</th><th></th></tr>
      ${clientes.map(([n,c])=>`<tr><td>${esc(n)}<br><span class="muted">último: ${c.ult.slice(8,10)}/${c.ult.slice(5,7)}</span></td><td class="nw">${c.n}</td><td class="num">${brl(c.v)}</td><td class="nw" style="text-align:right">${c.tel?`<a class="btn ghost sm" target="_blank" href="${wa(c.tel,`Olá, ${n}! Tudo bem? Passando para saber se precisa de reposição essa semana.`)}">WhatsApp</a>`:''}</td></tr>`).join('')}</table></div>
    <div>
      <div class="panel"><h2 style="margin-top:0">Motoristas</h2>
        <table class="tg t-mot"><tr><th>Nome</th><th class="nw">Entregues</th><th class="nw">Falhas</th><th class="nw">R$/parada</th><th></th></tr>
        ${porMot.map(x=>`<tr><td>${esc(x.m)}</td><td class="nw">${x.ent}</td><td class="nw ${x.fal?'low':''}">${x.fal}</td><td class="nw"><input type="number" step="0.5" value="${S.custoParada[x.m]||0}" style="width:70px;padding:4px 6px" onchange="S.custoParada[${esc(JSON.stringify(x.m))}]=+this.value;render()"></td><td class="nw" style="text-align:right"><button class="btn ghost sm" onclick="removerMotorista(${esc(JSON.stringify(x.m))})">Remover</button></td></tr>`).join('')}</table>
        <div class="row" style="margin-top:12px;grid-template-columns:1fr auto;align-items:end"><div class="field"><label>Novo motorista (nome e veículo)</label><input id="nm" placeholder="Ex.: Paulo (bicicleta)"></div><button class="btn" onclick="addMotorista()">Adicionar</button></div>
      </div>
      <div class="panel" style="margin-top:16px"><h2 style="margin-top:0">Dados da operação</h2>
        <div class="field"><label>Nome da base</label><input value="${esc(BASE.name)}" onchange="BASE.name=this.value;save()"></div>
        <div class="row" style="margin-top:10px"><div class="field"><label>Chave Pix</label><input value="${esc(S.chave.valor)}" onchange="S.chave.valor=this.value;save()"></div><div class="field"><label>Nome recebedor</label><input value="${esc(S.chave.nome)}" onchange="S.chave.nome=this.value;save()"></div></div>
        ${MODO==='real'
          ?`<div class="actions"><button class="btn ghost" onclick="exportar()">Exportar dados (JSON)</button><button class="btn ghost" onclick="trocarModo('demo')">Ver demonstração</button><button class="btn ghost" onclick="recomecarReal()">Recomeçar do zero</button></div>
            <p class="muted" style="margin-top:10px">Modo uso real: dados reais e a data de hoje. A demonstração fica salva à parte e não se mistura com estes dados.</p>`
          :`<div class="actions"><button class="btn" onclick="trocarModo('real')">${temReal?'Voltar ao uso real':'Começar uso real'}</button><button class="btn ghost" onclick="exportar()">Exportar dados (JSON)</button><button class="btn ghost" onclick="resetar()">Restaurar dados de exemplo</button></div>
            <p class="muted" style="margin-top:10px">${temReal?'O uso real continua de onde parou.':'O uso real começa do zero, sem dados de exemplo e com a data de hoje.'} A demonstração continua disponível.</p>`}
      </div>
    </div>
  </div>
  <div class="cols" style="margin-top:22px">
    <div class="panel"><h2 style="margin-top:0">Área de cobertura e taxa de entrega</h2>
      <table class="tg t-bairros"><tr><th>Bairro / região</th><th class="nw" style="text-align:right">Taxa</th><th></th></tr>
      ${S.bairros.map((b,i)=>`<tr><td>${esc(b.n)}</td><td class="num">${brl(b.taxa)}</td><td class="nw" style="text-align:right"><button class="btn ghost sm" onclick="S.bairros.splice(${i},1);render()">Remover</button></td></tr>`).join('')}</table>
      <div class="row" style="margin-top:12px;grid-template-columns:2fr 1fr auto;align-items:end"><div class="field"><label>Novo bairro</label><input id="nb-n" placeholder="Ex.: Vila Cristina"></div><div class="field"><label>Taxa (R$)</label><input id="nb-t" type="number" step="0.5" value="6"></div><button class="btn" onclick="addBairro()">Adicionar</button></div>
      <div class="note">Planejado: cobertura por raio no mapa e taxa dinâmica por distância, usando a geocodificação real dos endereços.</div>
    </div>
    <div class="panel"><h2 style="margin-top:0">Usuários e permissões <span class="soon">Em planejamento</span></h2>
      <table><tr><th>Perfil</th><th>Acesso</th></tr>
      <tr><td><b>Gestor</b></td><td class="muted">Tudo, incluindo Gestão, chave Pix e cadastro de equipe</td></tr>
      <tr><td><b>Separador</b></td><td class="muted">Pedidos e Estoque; não vê valores da Gestão</td></tr>
      <tr><td><b>Motorista</b></td><td class="muted">Só a rota do dia e a tela de Entregas, no celular</td></tr>
      <tr><td><b>Cliente</b></td><td class="muted">Página de rastreio pelo link, sem login</td></tr></table>
      <div class="actions"><button class="btn ghost" disabled>Convidar usuário</button></div>
    </div>
  </div>
  <div class="cols" style="margin-top:22px">
    <div class="panel"><h2 style="margin-top:0">Emissão fiscal <span class="soon">Em planejamento</span></h2>
      <p class="muted">Emissão de NFC-e e NF-e a partir do pedido entregue, com XML guardado em nuvem. Integração prevista via API de emissor fiscal homologado; o certificado digital fica com a cooperativa.</p>
      <div class="row"><div class="field"><label>Emissor fiscal</label><select disabled><option>Selecionar integração</option></select></div><div class="field"><label>Certificado A1</label><input disabled placeholder="Nenhum certificado enviado"></div></div>
      <div class="actions"><button class="btn ghost" disabled>Emitir NFC-e do último pedido</button></div>
    </div>
    <div class="panel"><h2 style="margin-top:0">App do motorista com GPS <span class="soon">Em planejamento</span></h2>
      <p class="muted">Aplicativo Android (React Native + Expo) que envia a posição do motorista a cada 30 s. Habilita o rastreio em tempo real para o cliente, a previsão de chegada e o registro automático de horário em cada parada.</p>
      <div class="phone"><div class="phone-bar"></div><div class="phone-map"><span class="pin"></span><span class="pin p2"></span><span class="me"></span></div><div class="phone-foot">Próxima parada: Mercearia Dona Lú · 6 min</div></div>
    </div>
  </div>
  <h2>Roadmap</h2>
  <div class="panel"><table class="roadmap tg"><tr><th>Função</th><th>Status</th><th>O que falta</th></tr>
    ${[
      ['Pedido por WhatsApp interpretado por IA','ok','Usa a IA no runtime do Claude; fora dele, um leitor por regras cobre as mensagens comuns. IA fora do Claude precisa de backend com a chave da API'],
      ['Roteirização e abertura no Google Maps','ok','—'],
      ['Pix dinâmico por pedido (BR Code)','ok','—'],
      ['Assistente em linguagem natural','ok','Sem a IA, responde às perguntas mais comuns pelas regras; perguntas livres precisam do mesmo backend'],
      ['Comprovante de entrega (foto, assinatura, recebedor)','ok','Foto reduzida para 720 px; armazenamento em nuvem ainda pendente'],
      ['Ocorrências com motivo e reagendamento','ok','Regras automáticas de nova tentativa'],
      ['Página de rastreio para o cliente','demo','Publicar no domínio e gerar link curto'],
      ['Notificações automáticas por etapa','demo','API oficial do WhatsApp Business (hoje o registro é simulado e o envio é por link)'],
      ['Janela de entrega e indicador de pontualidade','ok','Alerta de atraso antes do fim da janela'],
      ['Taxa de entrega por bairro e custo por parada','ok','Taxa por distância'],
      ['Emissão fiscal (NFC-e / NF-e)','plan','Integração com emissor homologado'],
      ['Validação de endereço e geocodificação','plan','API de Geocoding; hoje a posição vem do link do Google Maps ou é aproximada'],
      ['Usuários e permissões','plan','Autenticação e cadastro de perfis'],
      ['App do motorista com GPS em tempo real','plan','Build Android e serviço de posição'],
    ].map(([f,st,o])=>`<tr><td>${f}</td><td class="nw">${st==='ok'?'<span class="tag entregue">Disponível</span>':st==='demo'?'<span class="tag separado">Demonstração</span>':'<span class="tag rota">Em planejamento</span>'}</td><td class="muted">${o}</td></tr>`).join('')}
  </table></div>`;
}
function addBairro(){const n=document.getElementById('nb-n').value.trim(),t=+document.getElementById('nb-t').value;if(!n)return toast('Informe o bairro');S.bairros.push({n,taxa:t});toast('Bairro adicionado');render()}
// receita conta no dia em que foi entregue, não no dia do pedido
const dataEntrega=p=>(quandoUlt(p,'entregue')||p.comprovante?.hora||p.criado).slice(0,10);
const ultimos8=()=>[...Array(8)].map((_,i)=>{const d=new Date(HOJE+'T12:00'); d.setDate(d.getDate()-7+i); return iso(d,10)});
function drawChart(){
  const svg=document.getElementById('chart'); if(!svg)return;
  const dias=ultimos8();
  const vals=dias.map(d=>S.pedidos.filter(p=>p.status==='entregue'&&dataEntrega(p)===d).reduce((s,p)=>s+total(p),0));
  const max=Math.max(...vals,1), W=560,H=220,pl=44,pb=30,bw=(W-pl-10)/dias.length;
  let h=`<line x1="${pl}" y1="${H-pb}" x2="${W}" y2="${H-pb}" stroke="#E3DFD4"/>`;
  [0,.5,1].forEach(f=>{const y=H-pb-f*(H-pb-20);h+=`<text x="${pl-6}" y="${y+4}" font-size="10" fill="#7A8797" text-anchor="end">${Math.round(max*f)}</text><line x1="${pl}" y1="${y}" x2="${W}" y2="${y}" stroke="#EEEBE3"/>`});
  vals.forEach((v,i)=>{const bh=v/max*(H-pb-20),x=pl+i*bw+bw*.2,y=H-pb-bh;
    h+=`<rect x="${x}" y="${y}" width="${bw*.6}" height="${bh}" rx="3" fill="${dias[i]===HOJE?'#C9A84C':'#1F3A5F'}"/>`;
    if(v)h+=`<text x="${x+bw*.3}" y="${y-5}" font-size="10" fill="#1F3A5F" text-anchor="middle">${Math.round(v)}</text>`;
    h+=`<text x="${x+bw*.3}" y="${H-10}" font-size="11" fill="#4F6178" text-anchor="middle">${dias[i].slice(8)}/${dias[i].slice(5,7)}</text>`});
  svg.innerHTML=h;
}
function addMotorista(){const n=document.getElementById('nm').value.trim();if(!n)return toast('Informe o nome');if(S.motoristas.includes(n))return toast('Já cadastrado');S.motoristas.push(n);toast('Motorista adicionado');render()}
function removerMotorista(n){if(S.rota&&S.rota.motorista===n)return toast('Motorista está em rota hoje');S.motoristas=S.motoristas.filter(m=>m!==n);toast('Motorista removido');render()}
function exportar(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=MODO==='real'?'fluxo-dados-uso-real.json':'fluxo-dados.json';a.click()}
async function resetar(){if(MODO!=='demo')return;try{await DB.del('fluxo-state')}catch(e){}location.reload()}
// atalho no topo da tela: volta a demonstração ao início entre um ensaio e a apresentação
function reiniciarDemo(){if(confirm('Voltar a demonstração ao início? Tudo o que foi feito nela será desfeito.'))resetar()}

/* ---------- boot ---------- */
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v));
load().then(render);
</script>
</body>
